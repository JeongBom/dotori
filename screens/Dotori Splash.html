<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>도토리 · 스플래시</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
</style>
<style>
  :root {
    --brown: #8B5E3C;
    --warmOak: #A87850;
    --lightOak: #C49A6C;
    --ivory: #FFF8F0;
    --cream: #FDF6EC;
    --edge: #DEC8A8;
    --textDark: #5C3D1E;
    --textMid: #8B5E3C;
    --textLight: #A87850;
    --deepBrown: #6B4226;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #EFE5D3;
    overflow: hidden;
  }
  /* Full-bleed splash — scales to viewport */
  .splash {
    position: fixed; inset: 0;
    background: var(--cream);
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
  }

  /* Status bar (subtle, optional — hidden on narrow screens) */
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 54px; padding: 18px 28px 0;
    display: flex; justify-content: space-between; align-items: center;
    color: var(--textDark);
    font-family: -apple-system, system-ui, sans-serif;
    font-weight: 600; font-size: 15px;
    z-index: 5;
  }
  .statusbar svg { display: block; }

  /* Layout anchors — use viewport-relative % to stay centered on any size */
  .top-block {
    position: absolute; top: 16%; left: 0; right: 0;
    text-align: center;
    padding: 0 24px;
  }
  .kicker {
    font-size: 11px; color: var(--textLight); font-weight: 700; letter-spacing: 4px;
  }
  .title {
    font-size: clamp(48px, 12vw, 84px);
    font-weight: 900; color: var(--textDark);
    letter-spacing: -2.5px;
    margin-top: 16px; line-height: 1;
  }

  /* Horizon area — anchored to ~55% so it feels grounded but not glued to bottom */
  .horizon {
    position: absolute; bottom: 26%; left: 0; right: 0;
  }
  .acorn-row {
    display: flex; justify-content: space-around; align-items: flex-end;
    padding: 0 30px;
    position: relative; z-index: 2;
    margin-bottom: -2px;
  }
  .horizon-line {
    height: 1.5px; background: var(--textLight); opacity: 0.35;
  }
  .ground {
    height: 120px;
    background: linear-gradient(var(--edge), transparent);
    opacity: 0.4;
  }
  .trail-svg {
    position: absolute; left: 0; right: 0; bottom: 100%;
    width: 100%; height: 40px;
    transform: translateY(12px);
  }

  /* Bottom caption */
  .caption {
    position: absolute; bottom: 12%; left: 0; right: 0;
    text-align: center; padding: 0 24px;
  }
  .caption-main {
    font-size: 14px; color: var(--textMid); font-weight: 600;
    letter-spacing: -0.2px;
  }
  .loading-dots {
    display: flex; justify-content: center; gap: 6px;
    margin-top: 22px;
  }
  .loading-dots span {
    width: 6px; height: 6px; border-radius: 3px; background: var(--brown);
    animation: dots 1.4s ease-in-out infinite;
  }
  .loading-dots span:nth-child(1) { animation-delay: 0s; }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  /* Leaves */
  .leaf {
    position: absolute; top: -30px;
    animation: leaf-fall 6s ease-in infinite;
  }
  .leaf-1 { left: 14%; animation-delay: 0.6s; }
  .leaf-2 { right: 16%; animation-delay: 2.6s; animation-duration: 7s; }
  .leaf-3 { left: 35%; animation-delay: 4.2s; animation-duration: 5.5s; }

  /* ── Keyframes ─────────────────────────────────── */
  @keyframes fade-up {
    0% { opacity: 0; transform: translateY(12px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(22px) scale(0.6); }
    60% { opacity: 1; transform: translateY(-4px) scale(1.08); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes dash { 0% { stroke-dashoffset: 500; } 100% { stroke-dashoffset: 0; } }
  @keyframes dots { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  @keyframes leaf-fall {
    0% { opacity: 0; transform: translateY(-30px) rotate(0deg); }
    10% { opacity: 0.6; }
    100% { opacity: 0.2; transform: translateY(110vh) rotate(220deg); }
  }
  @keyframes sway-a {
    0%,100% { transform: rotate(-3deg); }
    50% { transform: rotate(2deg); }
  }
  @keyframes sway-b {
    0%,100% { transform: rotate(-2deg); }
    50% { transform: rotate(3deg); }
  }
  @keyframes sway-c {
    0%,100% { transform: rotate(4deg); }
    50% { transform: rotate(9deg); }
  }
  @keyframes walk {
    0%,100% { transform: translateY(0) translateX(0); }
    25% { transform: translateY(-2px) translateX(1px); }
    50% { transform: translateY(0) translateX(0); }
    75% { transform: translateY(-2px) translateX(-1px); }
  }

  /* Entry animations — staged */
  .kicker   { animation: fade-up 0.7s ease-out 0.2s both; }
  .title    { animation: fade-up 0.7s cubic-bezier(0.2,0.8,0.3,1) 0.35s both; }
  .horizon-line { animation: fade-up 0.6s ease-out 0.55s both; transform-origin: center; }
  .ground       { animation: fade-up 0.8s ease-out 0.6s both; }
  .trail-path {
    stroke-dasharray: 2 5;
    stroke-dashoffset: 500;
    animation: dash 2.2s ease-out 0.7s forwards;
  }
  .acorn-wrap {
    animation: pop 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
    transform-origin: bottom center;
  }
  .acorn-wrap.a1 { animation-delay: 0.8s; }
  .acorn-wrap.a2 { animation-delay: 0.95s; }
  .acorn-wrap.a3 { animation-delay: 1.1s; }
  .acorn-wrap.a4 { animation-delay: 1.25s; }

  .acorn-idle { transform-origin: bottom center; }
  .acorn-idle.i1 { animation: sway-b 2.8s ease-in-out 1.9s infinite; }
  .acorn-idle.i2 { animation: sway-a 3.2s ease-in-out 2.0s infinite; }
  .acorn-idle.i3 { animation: sway-c 2.5s ease-in-out 2.1s infinite; }
  .acorn-idle.i4 { animation: walk 2.0s ease-in-out 2.2s infinite; }

  .caption      { animation: fade-up 0.7s ease-out 1.5s both; }
  .loading-dots { animation: fade-up 0.7s ease-out 1.7s both; }

  /* Respect prefers-reduced-motion */
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* Replay button (dev helper) */
  .replay {
    position: absolute; bottom: 24px; right: 24px;
    padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--edge); background: #fff;
    color: var(--textDark); font-size: 11px; font-weight: 700;
    font-family: inherit; cursor: pointer; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    opacity: 0.7;
  }
  .replay:hover { opacity: 1; }
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="statusbar">
    <span>9:41</span>
    <div style="display:flex; gap:6px; align-items:center;">
      <svg width="18" height="11" viewBox="0 0 18 11">
        <rect x="0" y="7" width="3" height="4" rx="0.5" fill="currentColor"/>
        <rect x="5" y="5" width="3" height="6" rx="0.5" fill="currentColor"/>
        <rect x="10" y="2" width="3" height="9" rx="0.5" fill="currentColor"/>
        <rect x="15" y="0" width="3" height="11" rx="0.5" fill="currentColor"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12">
        <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" stroke-opacity="0.4" fill="none"/>
        <rect x="2" y="2" width="18" height="8" rx="1.5" fill="currentColor"/>
      </svg>
    </div>
  </div>

  <!-- Top: kicker + title -->
  <div class="top-block">
    <div class="kicker">TOGETHER SINCE TODAY</div>
    <div class="title">도토리</div>
  </div>

  <!-- Falling leaves -->
  <svg class="leaf leaf-1" width="20" height="20" viewBox="0 0 40 40">
    <path d="M20 5 C 30 8, 34 20, 28 32 C 16 34, 6 22, 12 10 Z" fill="#9AB87A"/>
    <path d="M20 8 Q 20 20 22 30" stroke="#7A9A5A" stroke-width="1" fill="none" stroke-linecap="round"/>
  </svg>
  <svg class="leaf leaf-2" width="16" height="16" viewBox="0 0 40 40">
    <path d="M20 5 C 30 8, 34 20, 28 32 C 16 34, 6 22, 12 10 Z" fill="#C8A47A"/>
  </svg>
  <svg class="leaf leaf-3" width="14" height="14" viewBox="0 0 40 40">
    <path d="M20 5 C 30 8, 34 20, 28 32 C 16 34, 6 22, 12 10 Z" fill="#B4C98A"/>
  </svg>

  <!-- Horizon with family of 4 acorns -->
  <div class="horizon">
    <!-- Dotted trail above the line -->
    <svg class="trail-svg" viewBox="0 0 380 40" preserveAspectRatio="none">
      <path class="trail-path" d="M20 20 Q 190 10, 360 20" stroke="var(--warmOak)" stroke-width="1.2" fill="none" opacity="0.5"/>
    </svg>

    <div class="acorn-row">
      <!-- Child 1 (medium, smile) -->
      <div class="acorn-wrap a1">
        <div class="acorn-idle i1">
          <svg width="70" height="84" viewBox="0 0 100 120" fill="none" style="transform: rotate(-4deg);">
            <path d="M52 18 C 60 8, 74 6, 82 12 C 78 22, 68 26, 58 24 C 54 23, 52 21, 52 18 Z" fill="#C8D89A"/>
            <path d="M50 24 L 50 18" stroke="#6B4226" stroke-width="2" stroke-linecap="round"/>
            <path d="M14 36 C 14 30, 18 24, 24 24 L 76 24 C 82 24, 86 30, 86 36 L 86 42 C 86 46, 83 48, 80 48 L 20 48 C 17 48, 14 46, 14 42 Z" fill="#A87850"/>
            <g fill="#6B4226" opacity="0.22"><circle cx="26" cy="34" r="1.6"/><circle cx="36" cy="40" r="1.6"/><circle cx="46" cy="34" r="1.6"/><circle cx="56" cy="40" r="1.6"/><circle cx="66" cy="34" r="1.6"/><circle cx="76" cy="40" r="1.6"/></g>
            <path d="M18 48 L 82 48 C 82 78, 68 106, 50 106 C 32 106, 18 78, 18 48 Z" fill="#A87850" opacity="0.72"/>
            <ellipse cx="34" cy="68" rx="6" ry="14" fill="#fff" opacity="0.2"/>
            <!-- smile face -->
            <circle cx="40" cy="74" r="1.8" fill="#6B4226"/>
            <circle cx="60" cy="74" r="1.8" fill="#6B4226"/>
            <path d="M43 82 Q 50 86, 57 82" stroke="#6B4226" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
      </div>

      <!-- Parent (big, happy) -->
      <div class="acorn-wrap a2">
        <div class="acorn-idle i2">
          <svg width="100" height="120" viewBox="0 0 100 120" fill="none">
            <path d="M52 18 C 60 8, 74 6, 82 12 C 78 22, 68 26, 58 24 C 54 23, 52 21, 52 18 Z" fill="#9AB87A"/>
            <path d="M52 18 Q 62 16, 78 14" stroke="#7A9A5A" stroke-opacity="0.55" stroke-width="1" stroke-linecap="round" fill="none"/>
            <path d="M50 24 L 50 18" stroke="#6B4226" stroke-width="2" stroke-linecap="round"/>
            <path d="M14 36 C 14 30, 18 24, 24 24 L 76 24 C 82 24, 86 30, 86 36 L 86 42 C 86 46, 83 48, 80 48 L 20 48 C 17 48, 14 46, 14 42 Z" fill="#8B5E3C"/>
            <g fill="#6B4226" opacity="0.22">
              <circle cx="26" cy="34" r="1.6"/><circle cx="36" cy="40" r="1.6"/><circle cx="46" cy="34" r="1.6"/>
              <circle cx="56" cy="40" r="1.6"/><circle cx="66" cy="34" r="1.6"/><circle cx="76" cy="40" r="1.6"/>
              <circle cx="31" cy="42" r="1.4"/><circle cx="51" cy="42" r="1.4"/><circle cx="71" cy="42" r="1.4"/>
            </g>
            <path d="M18 48 L 82 48 C 82 78, 68 106, 50 106 C 32 106, 18 78, 18 48 Z" fill="#8B5E3C" opacity="0.72"/>
            <ellipse cx="34" cy="68" rx="6" ry="14" fill="#fff" opacity="0.2"/>
            <!-- happy face -->
            <circle cx="40" cy="72" r="2.2" fill="#6B4226"/>
            <circle cx="60" cy="72" r="2.2" fill="#6B4226"/>
            <path d="M42 82 Q 50 88, 58 82" stroke="#6B4226" stroke-width="2" stroke-linecap="round" fill="none"/>
            <circle cx="34" cy="80" r="2.2" fill="#E8A5A5" opacity="0.55"/>
            <circle cx="66" cy="80" r="2.2" fill="#E8A5A5" opacity="0.55"/>
          </svg>
        </div>
      </div>

      <!-- Child 2 (small, baby) -->
      <div class="acorn-wrap a3">
        <div class="acorn-idle i3">
          <svg width="60" height="72" viewBox="0 0 100 120" fill="none" style="transform: rotate(5deg);">
            <path d="M52 18 C 60 8, 74 6, 82 12 C 78 22, 68 26, 58 24 C 54 23, 52 21, 52 18 Z" fill="#B4C98A"/>
            <path d="M50 24 L 50 18" stroke="#6B4226" stroke-width="2" stroke-linecap="round"/>
            <path d="M14 36 C 14 30, 18 24, 24 24 L 76 24 C 82 24, 86 30, 86 36 L 86 42 C 86 46, 83 48, 80 48 L 20 48 C 17 48, 14 46, 14 42 Z" fill="#C49A6C"/>
            <g fill="#6B4226" opacity="0.22"><circle cx="26" cy="34" r="1.6"/><circle cx="46" cy="34" r="1.6"/><circle cx="66" cy="34" r="1.6"/><circle cx="36" cy="40" r="1.4"/><circle cx="56" cy="40" r="1.4"/></g>
            <path d="M18 48 L 82 48 C 82 78, 68 106, 50 106 C 32 106, 18 78, 18 48 Z" fill="#C49A6C" opacity="0.72"/>
            <!-- baby face -->
            <circle cx="42" cy="76" r="1.5" fill="#6B4226"/>
            <circle cx="58" cy="76" r="1.5" fill="#6B4226"/>
            <circle cx="50" cy="82" r="1.8" fill="#E8A5A5" opacity="0.7"/>
          </svg>
        </div>
      </div>

      <!-- Child 3 (tiniest, no leaf) -->
      <div class="acorn-wrap a4">
        <div class="acorn-idle i4">
          <svg width="48" height="58" viewBox="0 0 100 120" fill="none">
            <path d="M14 36 C 14 30, 18 24, 24 24 L 76 24 C 82 24, 86 30, 86 36 L 86 42 C 86 46, 83 48, 80 48 L 20 48 C 17 48, 14 46, 14 42 Z" fill="#A87850"/>
            <g fill="#6B4226" opacity="0.22"><circle cx="26" cy="34" r="1.6"/><circle cx="46" cy="34" r="1.6"/><circle cx="66" cy="34" r="1.6"/></g>
            <path d="M18 48 L 82 48 C 82 78, 68 106, 50 106 C 32 106, 18 78, 18 48 Z" fill="#A87850" opacity="0.72"/>
            <!-- baby face -->
            <circle cx="42" cy="76" r="1.5" fill="#6B4226"/>
            <circle cx="58" cy="76" r="1.5" fill="#6B4226"/>
            <circle cx="50" cy="82" r="1.8" fill="#E8A5A5" opacity="0.7"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="horizon-line"></div>
    <div class="ground"></div>
  </div>

  <!-- Caption + loading -->
  <div class="caption">
    <div class="caption-main">한 알 한 알, 우리 집 이야기</div>
  </div>
  <div class="loading-dots" style="position: absolute; bottom: 8%; left: 0; right: 0;">
    <span></span><span></span><span></span>
  </div>

  <button class="replay" onclick="replay()">↻ 다시 재생</button>
</div>

<script>
  function replay() {
    const el = document.getElementById('splash');
    const clone = el.cloneNode(true);
    el.parentNode.replaceChild(clone, el);
    // Re-bind replay button
    clone.querySelector('.replay').onclick = replay;
  }
</script>

</body>
</html>
